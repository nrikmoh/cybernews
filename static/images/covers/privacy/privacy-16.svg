  <!-- Code lines -->
  <text x="46" y="348" font-family="Courier New,monospace" font-size="14"
        fill="rgba(255,255,255,0.7)">&gt; exploit.execute()</text>
  <text x="46" y="372" font-family="Courier New,monospace" font-size="14"
        fill="rgba(255,255,255,0.5)">&gt; dns.resolve(target)</text>

  <!-- Variant number watermark -->
  <g opacity="0.08">
    <text x="600" y="410" font-family="Arial,sans-serif" font-size="120"
