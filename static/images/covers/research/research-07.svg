<line x1="591" y1="141" x2="659" y2="-7" stroke="rgba(255,255,255,0.075)" stroke-width="1" />

  <circle cx="149" cy="51" r="2.159872156412076" fill="rgba(255,255,255,0.32)" />
<circle cx="689" cy="53" r="1.9637755981047924" fill="rgba(255,255,255,0.34)" />
<circle cx="70" cy="403" r="1.7272120764880259" fill="rgba(255,255,255,0.16)" />
<circle cx="23" cy="10" r="1.3199422161806043" fill="rgba(255,255,255,0.31)" />
