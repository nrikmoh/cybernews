<circle cx="75" cy="139" r="44" fill="rgba(255,255,255,0.087)" />
<circle cx="63" cy="402" r="80" fill="rgba(255,255,255,0.137)" />
<circle cx="36" cy="121" r="37" fill="rgba(255,255,255,0.107)" />

  <line x1="96" y1="206" x2="5" y2="99" stroke="rgba(255,255,255,0.094)" stroke-width="2" />
<line x1="46" y1="365" x2="-135" y2="348" stroke="rgba(255,255,255,0.085)" stroke-width="1" />
<line x1="374" y1="185" x2="308" y2="57" stroke="rgba(255,255,255,0.089)" stroke-width="1" />
<line x1="366" y1="263" x2="436" y2="153" stroke="rgba(255,255,255,0.052)" stroke-width="1" />
