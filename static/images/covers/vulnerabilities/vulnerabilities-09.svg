<line x1="585" y1="43" x2="671" y2="22" stroke="rgba(255,255,255,0.051)" stroke-width="1" />
<line x1="26" y1="345" x2="-1" y2="473" stroke="rgba(255,255,255,0.069)" stroke-width="1" />

