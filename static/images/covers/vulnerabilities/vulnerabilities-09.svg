<circle cx="647" cy="96" r="1.3995159480581445" fill="rgba(255,255,255,0.35)" />
<circle cx="637" cy="427" r="1.5752105403055956" fill="rgba(255,255,255,0.3)" />
<circle cx="217" cy="152" r="1.692910364608388" fill="rgba(255,255,255,0.28)" />
<circle cx="4" cy="200" r="1.2283710791988618" fill="rgba(255,255,255,0.25)" />
<circle cx="224" cy="413" r="1.586695103706853" fill="rgba(255,255,255,0.3)" />
