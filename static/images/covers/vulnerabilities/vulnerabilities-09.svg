<circle cx="447" cy="292" r="2.3000395663376767" fill="rgba(255,255,255,0.16)" />
<circle cx="56" cy="139" r="2.670996630934598" fill="rgba(255,255,255,0.35)" />


  <!-- Top left: CyberNews badge -->
